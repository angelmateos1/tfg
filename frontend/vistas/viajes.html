<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TravelQuest - Mis Viajes</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/viajes.css">
</head>
<body>

<div class="viajes-dashboard">

    <div class="viajes-topbar">
        <h1 class="titulo-pagina">✈️ Mis Viajes</h1>
        <div class="topbar-acciones">
            <button class="btn-nuevo-viaje" onclick="toggleFormulario()">+ Añadir Viaje</button>
            <button class="btn-volver" onclick="volverAlMapa()">← Volver al inicio</button>
        </div>
    </div>

    <!-- FORMULARIO NUEVO VIAJE -->
    <div class="formulario-viaje oculto-viajes" id="formulario-nuevo">
        <div class="card">
            <h3>Nuevo Viaje</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Destino</label>
                    <input type="text" id="input-destino" placeholder="Ej: París, Francia" required>
                </div>
                <div class="form-group">
                    <label>Fecha inicio</label>
                    <input type="date" id="input-inicio" required>
                </div>
                <div class="form-group">
                    <label>Fecha fin</label>
                    <input type="date" id="input-fin" required>
                </div>
            </div>
            <div class="form-acciones">
                <button class="btn-blue" onclick="guardarViaje()">💾 Guardar Viaje</button>
                <button class="btn-cancelar" onclick="toggleFormulario()">Cancelar</button>
            </div>
            <div class="form-feedback" id="form-feedback"></div>
        </div>
    </div>

    <!-- LISTA DE VIAJES -->
    <div class="viajes-grid" id="viajes-grid">
        <p class="text-muted-viajes">Cargando tus viajes...</p>
    </div>

    <!-- MODAL DETALLE VIAJE -->
<!-- MODAL DETALLE VIAJE -->
<div class="modal-overlay" id="modal-detalle" onclick="cerrarModalDetalle()">
    <div class="modal-contenido" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 id="modal-titulo">Cargando...</h2>
            <button class="btn-cerrar-modal" onclick="cerrarModalDetalle()">✕</button>
        </div>
        <div class="modal-body">
            <!-- INFO BÁSICA -->
            <div class="viaje-info-grid">
                <div class="info-item">
                    <span class="info-label">📍 Destino</span>
                    <span class="info-valor" id="modal-destino">—</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📅 Fechas</span>
                    <span class="info-valor" id="modal-fechas">—</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🌍 País</span>
                    <span class="info-valor" id="modal-pais">—</span>
                </div>
            </div>

            <!-- MONUMENTOS VISITADOS -->
            <div class="monumentos-seccion">
                <div class="seccion-header">
                    <h3>🏛️ Monumentos Visitados</h3>
                    <button class="btn-añadir-monumento" onclick="toggleFormMonumento()">+ Añadir</button>
                </div>

                <!-- Formulario añadir monumento -->
                <div class="form-monumento oculto-viajes" id="form-monumento">
                    <input type="text" id="input-nombre-monumento" placeholder="Nombre del monumento (ej: Torre Eiffel)">
                    <button class="btn-blue" onclick="validarMonumento()">📍 Validar ubicación</button>
                    <div id="monumento-feedback"></div>
                </div>

                <!-- Lista de monumentos -->
                <div class="monumentos-lista" id="monumentos-lista">
                    <p class="text-muted-monumentos">Cargando...</p>
                </div>
            </div>

            <!-- ITINERARIO -->
            <div class="itinerario-seccion">
                <h3>📝 Itinerario</h3>
                <textarea id="itinerario-texto" placeholder="Escribe aquí tu itinerario día a día..."></textarea>
                <div class="itinerario-acciones">
                    <button class="btn-blue" onclick="guardarItinerario()">💾 Guardar itinerario</button>
                    <button class="btn-ia" onclick="generarItinerarioIA()">✨ Generar con IA</button>
                </div>
                <div id="itinerario-feedback"></div>
            </div>
        </div>
    </div>
</div>

</div> <!-- fin viajes-dashboard -->
</div>

<script src="/static/js/config.js"></script>
<script src="/static/js/viajes.js"></script>
</body>
</html>
