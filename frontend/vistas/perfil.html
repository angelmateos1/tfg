<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TravelQuest - Mi Perfil</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/perfil.css">
</head>
<body>

<div class="perfil-dashboard">

    <div class="perfil-topbar">
        <h1 class="titulo-pagina">Mi Perfil</h1>
        <button class="btn-volver" onclick="volverAlMapa()">← Volver al inicio</button>
    </div>

    <div class="perfil-layout">

        <!-- COLUMNA IZQUIERDA -->
        <div class="perfil-sidebar">
            <div class="card card-perfil-basico">

                <div class="avatar-wrapper">
                    <div class="avatar-grande">
                        <img id="perfil-foto" src="" alt="Foto de perfil" style="display:none;">
                        <span id="perfil-iniciales">?</span>
                    </div>
                    <label class="btn-cambiar-foto" title="Cambiar foto">
                        📷
                        <input type="file" id="input-foto" accept="image/*" style="display:none;">
                    </label>
                </div>

                <h2 id="perfil-name-corto">Cargando...</h2>
                <p id="perfil-email-corto" class="text-muted">—</p>
                <p id="perfil-date-corto" class="text-muted small">—</p>

                <div class="id-box">
                    <div class="id-header">
                        <span>Tu código de Amigo</span>
                        <span>🎫</span>
                    </div>
                    <div class="id-value">
                        <span class="id-codigo" id="perfil-codigo">—</span>
                        <button class="btn-copiar" id="btn-copiar" title="Copiar código">📋</button>
                    </div>
                    <span class="copiar-feedback" id="copiar-feedback">¡Copiado!</span>
                </div>

                <div class="stats-list">
                    <div class="stat-item">
                        <div class="stat-label"><span>📍</span> Países</div>
                        <div class="stat-badge" id="stat-paises">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label"><span>🗺️</span> Viajes</div>
                        <div class="stat-badge" id="stat-viajes">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label"><span>🏆</span>Logros</div>
                        <div class="stat-badge" id="stat-logros">—</div>
                    </div>
                </div>

            </div>
        </div>

        <!-- COLUMNA DERECHA -->
        <div class="perfil-main">

            <div class="card">
                <div class="card-header">
                    <h3>Información Personal</h3>
                    <button class="btn-blue" onclick="toggleEditar()">✏️ Editar</button>
                </div>
                <div class="info-grid" id="info-ver">
                    <div class="info-group">
                        <label>name</label>
                        <p id="perfil-name">—</p>
                    </div>
                    <div class="info-group">
                        <label>Email</label>
                        <p id="perfil-email">—</p>
                    </div>
                    <div class="info-group">
                        <label>Biografía</label>
                        <p id="perfil-bio">—</p>
                    </div>
                </div>
                <div class="info-grid oculto-perfil" id="info-editar">
                    <div class="info-group">
                        <label>name</label>
                        <input type="text" id="edit-name" placeholder="name">
                    </div>
                    <div class="info-group">
                        <label>Apellidos</label>
                        <input type="text" id="edit-apellidos" placeholder="Apellidos">
                    </div>
                    <div class="info-group">
                        <label>Biografía</label>
                        <textarea id="edit-bio" placeholder="Cuéntanos algo sobre ti..."></textarea>
                    </div>
                    <button class="btn-blue" onclick="guardarPerfil()">💾 Guardar cambios</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>👥 Mis Amigos</h3>
                    <button class="btn-blue" onclick="toggleAñadirfriend()">👤+ Añadir Amigo</button>
                </div>
                <div class="añadir-friend-form oculto-perfil" id="form-añadir-friend">
                    <input type="text" id="input-codigo-friend" placeholder="Introduce el código TQ-XXXXXXXX">
                    <button class="btn-blue" onclick="añadirfriend()">Añadir</button>
                    <span class="friend-feedback" id="friend-feedback"></span>
                </div>
                <div class="friends-lista-vertical" id="friends-lista">
                    <p class="text-muted">Cargando amigos...</p>
                </div>
            </div>

            <div class="card">
            <!-- Cabecera modificada para incluir el contador -->
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h3>🏆 Logros</h3>
                
                <!-- ¡AQUÍ ESTÁ EL ID QUE FALTABA! -->
                <span class="badge-contador">
                    Desbloqueados: <strong id="stat-logros-seccion">0</strong>
                </span>
            </div>
            
            <!-- El grid donde se pintan los cuadritos -->
            <div class="logros-grid-nuevo" id="logros-grid"></div>
        </div>

        </div>
    </div>
</div>

<script src="/static/js/config.js"></script>
<script src="/static/js/perfil.js"></script>
</body>
</html>
