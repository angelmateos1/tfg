<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasaporte de Viajes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/styles.css"> 
    <link rel="stylesheet" href="/static/perfil.css">
    <link rel="stylesheet" href="/static/ranking.css">
    <link rel="stylesheet" href="/static/viajes.css">
</head>
<body>

    <div id="loginSection">
    <div class="login-imagen">
        <img src="/static/logo.png" alt="Logo TravelQuest">
    </div>
    <div class="form-login">
        <!-- FORMULARIO LOGIN -->
        <div id="form-login-view">
            <h2>✈️ TravelQuest</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Bienvenido, viajero. Identifícate.</p>
            
            <input type="text" id="username" placeholder="Tu usuario">
            <input type="password" id="password" placeholder="Tu contraseña">
            
            <button class="btn-entrar" onclick="hacerLogin()">Entrar al mapa</button>
            
            <div class="login-links">
                <a href="#" onclick="mostrarRegistro(); return false;">Crear cuenta</a>
                <a href="#" onclick="mostrarRecuperacion(); return false;">¿Olvidaste tu contraseña?</a>
            </div>
        </div>

        <!-- FORMULARIO REGISTRO -->
        <div id="form-registro-view" style="display: none;">
            <h2>✈️ Crear Cuenta</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Únete a la comunidad de viajeros</p>
            
            <input type="text" id="reg-username" placeholder="Usuario">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-password" placeholder="Contraseña">
            <input type="password" id="reg-password2" placeholder="Repetir contraseña">
            
            <button class="btn-entrar" onclick="hacerRegistro()">Crear cuenta</button>
            
            <div class="login-links">
                <a href="#" onclick="mostrarLogin(); return false;">← Volver al login</a>
            </div>
            
            <div id="registro-feedback" style="margin-top: 10px; font-size: 13px;"></div>
        </div>

        <!-- FORMULARIO RECUPERACIÓN -->
        <div id="form-recuperacion-view" style="display: none;">
            <h2>🔑 Recuperar Contraseña</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Introduce tu email</p>
            
            <div id="paso-1-recuperacion">
                <input type="email" id="recup-email" placeholder="Tu email">
                <button class="btn-entrar" onclick="enviarCodigoRecuperacion()">Enviar código</button>
            </div>

            <div id="paso-2-recuperacion" style="display: none;">
                <input type="text" id="recup-codigo" placeholder="Código de 6 dígitos" maxlength="6">
                <input type="password" id="recup-nueva-password" placeholder="Nueva contraseña">
                <button class="btn-entrar" onclick="verificarCodigoRecuperacion()">Cambiar contraseña</button>
            </div>
            
            <div class="login-links">
                <a href="#" onclick="mostrarLogin(); return false;">← Volver al login</a>
            </div>
            
            <div id="recuperacion-feedback" style="margin-top: 10px; font-size: 13px;"></div>
        </div>
    </div>
    </div>

    <div id="appSection" style="display: none;">
        <nav class="navbar">
            <div class="nav-logo">🗺️ TravelQuest</div>
            <div class="nav-links">
                <button class="nav-btn active" onclick="cerrarVista()">Mapa</button>
                <button class="nav-btn" onclick="mostrarViajes()">Viajes</button>
                <button class="nav-btn" onclick="mostrarRanking()">Ranking</button>
                <button class="nav-btn" onclick="mostrarPerfil()">Perfil</button>
                <button class="nav-btn btn-salir" onclick="cerrarSesion()">Salir</button>
            </div>
        </nav>

        <main class="app-body">
            <div class="map-wrapper" id="mapWrapper">   <!-- ← añadir id -->
                <div class="map-card">
                    <div id="miMapa"></div>
                </div>
            </div>
            <div id="contenedorCentral" class="oculto"></div>
        </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
